# MBTI — 16 психологических типов (reference)
# Версия: 1.0.0 — контент draft для HR-отчётов (акмеологический контекст)
# Scoring → type_code → lookup. AI summary дополняет, не заменяет.

types:

  ISTJ:
    code: ISTJ
    name_ru: "Логистик (Inspector)"
    axes: { "E/I": I, "S/N": S, "T/F": T, "J/P": J }
    tagline: "Надёжный организатор процессов и стандартов"
    strengths:
      - "Последовательность и ответственность за результат"
      - "Внимание к деталям и соблюдению регламентов"
      - "Спокойствие в рутинных и повторяющихся задачах"
    growth_areas:
      - "Гибкость при быстрых изменениях приоритетов"
      - "Открытость к альтернативным подходам команды"
      - "Эмоциональная обратная связь, не только факты"

  ISFJ:
    code: ISFJ
    name_ru: "Защитник (Protector)"
    axes: { "E/I": I, "S/N": S, "T/F": F, "J/P": J }
    tagline: "Опора команды в заботе о людях и стабильности"
    strengths:
      - "Внимательность к потребностям коллег и клиентов"
      - "Надёжное исполнение обязательств"
      - "Создание предсказуемой рабочей среды"
    growth_areas:
      - "Умение говорить «нет» перегрузке"
      - "Инициатива в спорных ситуациях"
      - "Делегирование вместо гиперопеки"

  INFJ:
    code: INFJ
    name_ru: "Советник (Advocate)"
    axes: { "E/I": I, "S/N": N, "T/F": F, "J/P": J }
    tagline: "Видит смысл и помогает другим раскрыть потенциал"
    strengths:
      - "Эмпатия и глубокое понимание мотивов"
      - "Стратегическое видение развития людей"
      - "Последовательность ценностей в решениях"
    growth_areas:
      - "Защита личных границ от выгорания"
      - "Практичность в сроках и ресурсах"
      - "Прямая обратная связь без излишнего идеализма"

  INTJ:
    code: INTJ
    name_ru: "Стратег (Architect)"
    axes: { "E/I": I, "S/N": N, "T/F": T, "J/P": J }
    tagline: "Системный мыслитель и архитектор долгосрочных решений"
    strengths:
      - "Аналитика сложных задач и сценарное планирование"
      - "Независимость суждений и фокус на цели"
      - "Улучшение процессов и стандартов"
    growth_areas:
      - "Вовлечение команды на ранних этапах решений"
      - "Терпение к «медленным» этапам согласования"
      - "Учёт эмоционального климата, не только логики"

  ISTP:
    code: ISTP
    name_ru: "Virtuoso / Мастер"
    axes: { "E/I": I, "S/N": S, "T/F": T, "J/P": P }
    tagline: "Практик, решающий проблемы здесь и сейчас"
    strengths:
      - "Быстрая диагностика неисправностей и узких мест"
      - "Спокойствие в кризисе"
      - "Эффективные hands-on решения"
    growth_areas:
      - "Документирование решений для команды"
      - "Соблюдение сроков долгосрочных проектов"
      - "Проактивное информирование стейкхолдеров"

  ISFP:
    code: ISFP
    name_ru: "Композитор (Adventurer)"
    axes: { "E/I": I, "S/N": S, "T/F": F, "J/P": P }
    tagline: "Гибкий исполнитель с чувством эстетики и ценностей"
    strengths:
      - "Адаптивность и уважение к индивидуальности"
      - "Качество в деталях продукта или сервиса"
      - "Спокойная поддержка в стрессовых ситуациях"
    growth_areas:
      - "Структурирование приоритетов и дедлайнов"
      - "Отстаивание своей позиции в конфликте"
      - "Планирование карьерного роста заранее"

  INFP:
    code: INFP
    name_ru: "Посредник (Mediator)"
    axes: { "E/I": I, "S/N": N, "T/F": F, "J/P": P }
    tagline: "Ориентир на смысл, ценности и аутентичность"
    strengths:
      - "Креативность и нестандартные идеи"
      - "Глубокая лояльность команде и миссии"
      - "Чуткость к этическим аспектам решений"
    growth_areas:
      - "Доведение идей до измеримого результата"
      - "Работа с жёсткими дедлайнами"
      - "Конструктивный конфликт без ухода от темы"

  INTP:
    code: INTP
    name_ru: "Thinker / Логик"
    axes: { "E/I": I, "S/N": N, "T/F": T, "J/P": P }
    tagline: "Исследователь идей и логических моделей"
    strengths:
      - "Абстрактное мышление и поиск закономерностей"
      - "Объективный анализ без предвзятости"
      - "Быстрое освоение новых концепций"
    growth_areas:
      - "Коммуникация выводов простым языком"
      - "Следование согласованным процедурам"
      - "Завершение начатых инициатив"

  ESTP:
    code: ESTP
    name_ru: "Предприниматель (Entrepreneur)"
    axes: { "E/I": E, "S/N": S, "T/F": T, "J/P": P }
    tagline: "Действует быстро, ориентирован на результат"
    strengths:
      - "Реакция на возможности и риски в моменте"
      - "Убедительность в переговорах"
      - "Энергия и драйв команды"
    growth_areas:
      - "Долгосрочное планирование последствий"
      - "Учёт регламентов и compliance"
      - "Выслушивание перед финальным решением"

  ESFP:
    code: ESFP
    name_ru: "Entertainer / Артист"
    axes: { "E/I": E, "S/N": S, "T/F": F, "J/P": P }
    tagline: "Создаёт позитивный контакт и живую атмосферу"
    strengths:
      - "Лёгкость в коммуникации и презентациях"
      - "Гибкость в изменяющихся условиях"
      - "Мотивация команды через вовлечённость"
    growth_areas:
      - "Систематизация задач и follow-up"
      - "Фокус на приоритетах при перегрузке"
      - "Работа с критической обратной связью"

  ENFP:
    code: ENFP
    name_ru: "Борец (Campaigner)"
    axes: { "E/I": E, "S/N": N, "T/F": F, "J/P": P }
    tagline: "Вдохновляет идеей и связывает людей вокруг цели"
    strengths:
      - "Энтузиазм и генерация идей"
      - "Сетевое взаимодействие и влияние"
      - "Чувствительность к потребностям стейкхолдеров"
    growth_areas:
      - "Дисциплина завершения проектов"
      - "Реалистичная оценка ресурсов"
      - "Рутинные операционные задачи"

  ENTP:
    code: ENTP
    name_ru: "Debater / Полемист"
    axes: { "E/I": E, "S/N": N, "T/F": T, "J/P": P }
    tagline: "Генерирует варианты и оспаривает статус-кво"
    strengths:
      - "Быстрое видение альтернатив"
      - "Аргументация и убеждение"
      - "Инновации в процессах"
    growth_areas:
      - "Уважение к принятым решениям команды"
      - "Эмпатия при жёсткой обратной связи"
      - "Последовательность в исполнении"

  ESTJ:
    code: ESTJ
    name_ru: "Менеджер (Executive)"
    axes: { "E/I": E, "S/N": S, "T/F": T, "J/P": J }
    tagline: "Организует людей и процессы для результата"
    strengths:
      - "Чёткое планирование и контроль исполнения"
      - "Ответственность за командный KPI"
      - "Прямота и ясность ожиданий"
    growth_areas:
      - "Гибкость при нестандартных ситуациях"
      - "Развитие автономии у подчинённых"
      - "Учёт нематериальных мотиваторов"

  ESFJ:
    code: ESFJ
    name_ru: "Консул (Consul)"
    axes: { "E/I": E, "S/N": S, "T/F": F, "J/P": J }
    tagline: "Координирует команду через заботу и порядок"
    strengths:
      - "Поддержание рабочих отношений"
      - "Организация совместной работы"
      - "Ориентация на клиента и коллег"
    growth_areas:
      - "Принятие непопулярных решений"
      - "Границы при эмоциональной нагрузке"
      - "Стратегическое мышление beyond операционки"

  ENFJ:
    code: ENFJ
    name_ru: "Protagonist / Наставник"
    axes: { "E/I": E, "S/N": N, "T/F": F, "J/P": J }
    tagline: "Развивает людей и объединяет вокруг цели"
    strengths:
      - "Наставничество и мотивация"
      - "Видение развития команды"
      - "Коммуникация с разными аудиториями"
    growth_areas:
      - "Объективные метрики, не только интуиция"
      - "Защита времени на собственные задачи"
      - "Принятие критики без персонализации"

  ENTJ:
    code: ENTJ
    name_ru: "Командир (Commander)"
    axes: { "E/I": E, "S/N": N, "T/F": T, "J/P": J }
    tagline: "Ведёт к цели через стратегию и решительность"
    strengths:
      - "Стратегическое лидерство"
      - "Быстрые решения в неопределённости"
      - "Масштабирование процессов и команд"
    growth_areas:
      - "Выслушивание dissenting opinions"
      - "Терпение к темпу развития людей"
      - "Баланс результата и выгорания команды"

# Validation: type_code from dichotomy_scorer MUST be one of these 16 keys.
