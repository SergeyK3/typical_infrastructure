# PAEI forced-choice item bank v1 (from 07 PsychTest data/prompts/adizes_user.txt)
version: 1.0.0
test_id: paei
lang: ru
source_prompt: data/prompts/adizes_user.txt
items:
  - id: paei_001
    text: "Когда возникает сложная задача, требующая немедленного решения, что вы делаете в первую очередь?"
    options:
      P: "Сразу действую, чтобы быстро выполнить."
      A: "Составляю четкий план и оцениваю риски."
      E: "Предлагаю новый подход к решению задачи."
      I: "Собираю команду для обсуждения."
  - id: paei_002
    text: "Как вы справляетесь с внезапными изменениями в проекте?"
    options:
      P: "Перенаправляю усилия по проекту."
      A: "Уточняю изменения и корректирую планы."
      E: "Изменения – это возможность для улучшения."
      I: "Помогаю коллегам адаптироваться."
  - id: paei_003
    text: "Если в вашей команде назревает конфликт, как вы поступите?"
    options:
      P: "Концентрируюсь на задаче, не вмешиваюсь."
      A: "Напоминаю всем о правилах и обязанностях."
      E: "Ищу новое решение: отвлечь от конфликта."
      I: "Действую как медиатор, чтобы найти компромисс."
  - id: paei_004
    text: "Как вы подходите к выполнению нового проекта?"
    options:
      P: "Сразу приступаю к работе."
      A: "Разрабатываю структуру и шаги действий."
      E: "Начинаю с поиска возможностей."
      I: "Члены команды должны понимать свои роли."
  - id: paei_005
    text: "Какой формат работы вам наиболее комфортен?"
    options:
      P: "Быстрое выполнение задач с четкими целями."
      A: "Стабильная работа по правилам."
      E: "Проекты, требующие творчества и гибкости."
      I: "Акцент на взаимодействие и коммуникацию."
