# Typical infrastructure MVP — staging / production-like setup
# Usage: docker compose up -d

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8100}:8000"
    environment:
      - APP_NAME=${APP_NAME:-Typical infrastructure}
      - SQLITE_PATH=/app/data/app.db
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-dev-insecure-auth-secret-change-me}
      - SYSTEM_ADMIN_LOGIN=${SYSTEM_ADMIN_LOGIN:-}
      - SYSTEM_ADMIN_PASSWORD=${SYSTEM_ADMIN_PASSWORD:-}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  app_data:
